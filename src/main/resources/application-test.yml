spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///ledger
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

ledger:
  security:
    refresh-token-store: inmemory
  gateway:
    settle-async: false
  rate-limit:
    login-per-minute: 1000
    transfer-per-minute: 1000
